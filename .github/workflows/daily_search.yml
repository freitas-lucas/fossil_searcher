name: Daily PubMed Fossil Search

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day
  workflow_dispatch:      # Allows manual trigger

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required to push changes back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run search script
      run: python script.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update PubMed fossil data [$(date +'%Y-%m-%d')]" && git push)
